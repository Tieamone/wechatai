name: Windows checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/tools/browsers
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.10'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: python tools/check_public.py
      - run: python -m pip install -r requirements.lock.txt
      - run: npm ci --ignore-scripts
        working-directory: tools/wechat-mcp
      - run: npm run build
        working-directory: tools/wechat-mcp
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npx playwright install chromium
        working-directory: frontend
      - run: node e2e/evidence-check.mjs
        working-directory: frontend
      - run: python -m pytest -q
      - run: python -m tools.browser_check
      - run: python -m tools.browser_check --context
      - run: python -m tools.browser_check --p0
      - run: python -m tools.browser_check --budgets
      - run: python -m tools.calibration_browser_check
      - name: Upload synthetic browser failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-artifacts/
          if-no-files-found: warn
          retention-days: 7
