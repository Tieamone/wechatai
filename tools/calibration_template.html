<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'nonce-NONCE_VALUE'; style-src 'nonce-NONCE_VALUE'; connect-src 'none'; base-uri 'none'; form-action 'none'">
<title>记忆校准 · 本机人工标注</title>
<style nonce="NONCE_VALUE">*{box-sizing:border-box}body{font:16px/1.7 system-ui;margin:28px auto;padding:0 20px;max-width:1100px;background:#f1f6f3;color:#193c31}header,article{background:white;padding:22px;border:1px solid #c4d5ca;border-radius:12px;margin-bottom:18px}button,select,input{font:inherit}button,select{padding:10px;margin:5px;border:1px solid #739c89;border-radius:7px;background:#fff;color:#193c31}button{cursor:pointer}button[aria-pressed=true]{background:#236a50;color:white}button:disabled{opacity:.45;cursor:default}blockquote{white-space:pre-wrap;overflow-wrap:anywhere;margin:12px 0;padding:14px;border-left:4px solid #6d9f87;background:#f5f9f7}h2{font-size:21px;overflow-wrap:anywhere}small{color:#5c7165}.row{display:flex;flex-wrap:wrap;align-items:center;gap:5px}label{display:block;margin:10px 0}.notice{color:#78520b}progress{width:100%;accent-color:#236a50}pre{white-space:pre-wrap}#status{min-height:28px}</style>
<header><h1>记忆校准 · 由你决定什么值得记</h1><p>本页只读业务库，不调用模型，不替你作判断。每条选一个主结论；其余维度可留空，留空不等于“正确”或“不敏感”。页面含聊天内容，请只留本机。</p>
<div class="row"><button id="export">导出已标注结论</button><button id="progress">保存续填进度 JSON</button><label>导入进度<input id="import" type="file" accept="application/json"></label></div><p id="storage" class="notice"></p><p id="status" role="status"></p><progress id="completion" max="1" value="0"></progress></header>
<div class="row"><button id="previous">上一条</button><span id="position"></span><button id="next">下一条／跳过</button></div><main id="card"></main>
<script id="snapshot" type="application/json">SNAPSHOT_DATA</script>
<script nonce="NONCE_VALUE">
const snapshot=JSON.parse(document.getElementById('snapshot').textContent),rows=snapshot.cards;
const answers={long:'长期有价值',short:'短期有价值',trivial:'小事（不值得记）',incorrect:'有误',outdated:'已过期',uncertain:'不确定'};
const support={supported:'支持',partial:'部分支持',unsupported:'不支持',uncertain:'不确定'};
const validity={one_two_weeks:'约 1–2 周',one_two_months:'约 1–2 个月',until_agreement:'至约定日',long_term:'长期',expired:'已过期',uncertain:'不确定'};
const sensitive={none:'明确不涉及',health:'健康',financial:'财务',privacy_token:'隐私代号',health_financial:'健康＋财务',health_privacy_token:'健康＋隐私代号',financial_privacy_token:'财务＋隐私代号',health_financial_privacy_token:'三类都涉及',uncertain:'不确定'};
const fields=['memory_id','memory_version','conclusion','health_finance','evidence_support','validity_bin','sensitive_type'];
const labels=new Map();let index=0,storage=true;const key='memory-calibration-v1-'+snapshot.snapshot_sha256;
function blank(row){return {memory_id:row.memory_id,memory_version:row.memory_version,conclusion:null,health_finance:false,evidence_support:null,validity_bin:null,sensitive_type:null}}
function validate(pack){if(pack.format!==1||pack.snapshot_sha256!==snapshot.snapshot_sha256||!Array.isArray(pack.labels)||pack.labels.length>rows.length)throw Error('快照或格式不匹配，未导入');const seen=new Set();for(const x of pack.labels){const row=rows.find(r=>r.memory_id===x.memory_id);if(!row||row.memory_version!==x.memory_version||seen.has(x.memory_id)||Object.keys(x).some(k=>!fields.includes(k))||typeof x.health_finance!=='boolean')throw Error('ID、版本或字段不匹配，未导入');for(const [field,allowed] of [['conclusion',answers],['evidence_support',support],['validity_bin',validity],['sensitive_type',sensitive]])if(x[field]!==null&&!Object.hasOwn(allowed,x[field]))throw Error('标注值无效，未导入');seen.add(x.memory_id)}return pack.labels}
function pack(all=true){return {format:1,snapshot_sha256:snapshot.snapshot_sha256,labels:rows.map(r=>labels.get(r.memory_id)||blank(r)).filter(r=>all||r.conclusion!==null)}}
function setStatus(text){document.getElementById('status').textContent=text}
function save(){try{localStorage.setItem(key,JSON.stringify(pack()))}catch{storage=false}document.getElementById('storage').textContent=storage?'进度自动保存在此浏览器；换浏览器请先保存续填 JSON。':'浏览器存储不可用。退出前请保存续填 JSON，重新打开后导入继续。';const count=[...labels.values()].filter(x=>x.conclusion!==null).length;document.getElementById('completion').max=rows.length||1;document.getElementById('completion').value=count;document.getElementById('position').textContent=rows.length?`第 ${index+1} / ${rows.length} 条 · 已标 ${count} 条`:'没有待校准记忆'}
function add(parent,tag,text){const el=document.createElement(tag);el.textContent=text;parent.append(el);return el}
function change(field,value){const row=rows[index],current=labels.get(row.memory_id)||blank(row);labels.set(row.memory_id,{...current,[field]:value});save()}
function render(){const main=document.getElementById('card');main.replaceChildren();document.getElementById('previous').disabled=index===0;document.getElementById('next').disabled=index>=rows.length-1;if(!rows.length){save();return}const row=rows[index],entry=labels.get(row.memory_id)||blank(row),card=add(main,'article','');add(card,'small',`记忆 #${row.memory_id} · 版本 ${row.memory_version}`);add(card,'h2',row.summary);row.evidence.forEach(e=>{add(card,'small',`原文 #${e.message_id} · 版本 ${e.message_revision} · ${{self:'本人',peer:'对方',system:'系统'}[e.sender_role]||'未知'}`);add(card,'blockquote',e.text.slice(e.span_start,e.span_end))});const group=add(card,'div','');group.className='row';for(const [value,title] of Object.entries(answers)){const button=add(group,'button',title);button.setAttribute('aria-pressed',String(entry.conclusion===value));button.onclick=()=>{change('conclusion',value);setStatus(`已记录你的结论：${title}`);if(index<rows.length-1)index++;render()}}const health=add(card,'label',''),check=document.createElement('input');check.type='checkbox';check.checked=entry.health_finance;check.setAttribute('aria-label','涉及健康或财务');health.append(check,document.createTextNode(' 涉及健康或财务（默认不勾；未勾不作为“不敏感”标签）'));check.onchange=()=>change('health_finance',check.checked);const details=add(card,'details','');add(details,'summary','可选独立维度（默认空白）');for(const [field,title,allowed] of [['evidence_support','证据支持',support],['validity_bin','有效期档位',validity],['sensitive_type','敏感类别',sensitive]]){const label=add(details,'label',title),select=document.createElement('select');select.setAttribute('aria-label',title);add(select,'option','未标注').value='';for(const [value,text] of Object.entries(allowed))add(select,'option',text).value=value;select.value=entry[field]||'';select.onchange=()=>change(field,select.value||null);label.append(select)}save()}
document.getElementById('previous').onclick=()=>{if(index>0)index--;render()};document.getElementById('next').onclick=()=>{if(index<rows.length-1)index++;render()};
function download(all){const data=pack(all);if(!all&&!data.labels.length){setStatus('尚无主结论，没有导出文件');return}const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download=all?'calibration-progress.json':'calibration-labels.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);setStatus('已导出 ID、版本和你的标注，不含摘要或原文')}
document.getElementById('export').onclick=()=>download(false);document.getElementById('progress').onclick=()=>download(true);
document.getElementById('import').onchange=async e=>{try{const file=e.target.files[0];if(!file)return;if(file.size>1024*1024)throw Error('进度文件超过大小上限');const entries=validate(JSON.parse(await file.text()));labels.clear();entries.forEach(x=>labels.set(x.memory_id,x));const first=rows.findIndex(r=>!labels.get(r.memory_id)?.conclusion);index=first<0?0:first;render();setStatus('已恢复你的进度；未自动填写新结论')}catch(error){setStatus(error.message||'导入失败，当前标注未变')}finally{e.target.value=''}};
try{const saved=localStorage.getItem(key);if(saved)validate(JSON.parse(saved)).forEach(x=>labels.set(x.memory_id,x));const first=rows.findIndex(r=>!labels.get(r.memory_id)?.conclusion);index=first<0?0:first}catch{storage=false}render();
</script></html>
